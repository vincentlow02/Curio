name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qwen-spike
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: qwen-spike/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run typecheck:strict
      - run: npm run build
      - run: docker build --tag curio-security-check .
      - name: Smoke-test production container
        run: |
          docker run --detach --name curio-security-smoke \
            --publish 3000:3000 \
            --env DEMO_ACCESS_CODE=ci-smoke \
            curio-security-check
          trap 'docker logs curio-security-smoke; docker rm --force curio-security-smoke' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              exit 1
            fi
            sleep 1
          done
          status="$(curl --silent --output /tmp/analysis-response.json --write-out '%{http_code}' \
            --header 'x-demo-code: ci-smoke' \
            --form 'text=Sony PSP-3000 handheld console' \
            http://127.0.0.1:3000/api/analysis)"
          test "$status" = "202"
